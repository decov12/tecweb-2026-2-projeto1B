{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img class="logo" src="{% static 'notes/img/logo-getit.png' %}" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
  <a class="btn tags-link" href="{% url 'tags' %}">Tags</a>
</div>

<div class="container">
  <form class="form-card" method="post">
    {% csrf_token %}
    <label for="titulo">Título</label>
    <input
      class="form-card-title"
      id="titulo"
      type="text"
      name="titulo"
      value="{{ note.title }}"
    />
    <label for="detalhes">Detalhes</label>
    <textarea class="autoresize" id="detalhes" name="detalhes"></textarea>
    <label for="tag">Tag (opcional)</label>
    <input class="form-card-tag" id="tag" type="text" name="tag" placeholder="ex: trabalho" />
    <input class="btn" type="submit" value="Adicionar" />
  </form>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <p class="card-title">{{ note.title }}</p>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
      {% if note.tag %}
      <a class="tag-chip" href="{% url 'tag_detail' note.tag.id %}">#{{ note.tag.name }}</a>
      {% endif %}
      <div class="card-actions">
        <a class="btn" href="{% url 'edit' note.id %}">Editar</a>
        <a class="btn" href="{% url 'delete' note.id %}">Excluir</a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
