{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img class="logo" src="{% static 'notes/img/logo-getit.png' %}" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

<div class="container">
  <form class="form-card" method="post">
    {% csrf_token %}
    <label for="titulo">Título</label>
    <input class="form-card-title" id="titulo" type="text" name="titulo" />
    <label for="detalhes">Detalhes</label>
    <textarea class="autoresize" id="detalhes" name="detalhes"></textarea>
    <input class="btn" type="submit" value="Adicionar" />
  </form>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <p class="card-title">{{ note.title }}</p>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
